# Next.js SSR/API deployment; never use drag-and-drop static hosting for this app.
[build]
  command = "npm run deployment:check && npm run build"
  publish = ".next-build"

[build.environment]
  NODE_VERSION = "22.20.0"
  NEXT_TELEMETRY_DISABLED = "1"

# App settings/secrets MUST be supplied in Netlify's environment settings,
# available to both Builds and Functions. TOML values are build-only.
# Netlify automatically supplies its maintained Next.js adapter; do not pin it.
